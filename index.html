<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashroute - Sistema de Rotas</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#0d9488',
              darkTeal: '#0f766e',
              yellow: '#eab308',
              light: '#f0fdf4'
            }
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Sortable JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased h-screen flex flex-col">

  <!-- TOPNAV -->
  <header class="bg-brand-darkTeal text-white px-6 py-3 flex items-center justify-between shadow-md no-print">
    <div class="flex items-center gap-3">
      <div class="bg-brand-yellow p-2 rounded-lg text-gray-900 font-bold text-xl flex items-center justify-center w-10 h-10">
        <i class="ph-bold ph-navigation-arrow"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-wide">Flashroute</h1>
        <p class="text-xs text-teal-200">Distribuição & Rotas Inteligentes</p>
      </div>
    </div>
    
    <div id="user-info" class="flex items-center gap-4 text-sm">
      <span class="bg-teal-800 px-3 py-1 rounded-full text-xs">Operador: <strong>Carlos Silva</strong></span>
      <button onclick="toggleLogin()" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded transition">Sair</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- SIDEBAR / PAINEL LATERAL -->
    <aside class="w-96 bg-white border-r border-gray-200 flex flex-col z-10 no-print shadow-lg">
      
      <!-- CONTROLES SUPERIORES -->
      <div class="p-4 border-b border-gray-200 bg-gray-50 flex flex-col gap-2">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-gray-700 flex items-center gap-2">
            <i class="ph-bold ph-list-numbers text-brand-teal"></i> Pontos de Entrega
          </h2>
          <span id="total-count" class="text-xs bg-gray-200 px-2 py-0.5 rounded-full font-semibold">0 paradas</span>
        </div>
        
        <div class="flex gap-2 mt-2">
          <button onclick="otimizarRota()" class="flex-1 bg-brand-teal hover:bg-brand-darkTeal text-white text-xs py-2 px-3 rounded flex items-center justify-center gap-1.5 font-medium transition shadow-sm">
            <i class="ph-bold ph-magic-wand"></i> Otimizar Rota
          </button>
          <button onclick="adicionarNovoEnderecoModal()" class="bg-brand-yellow hover:bg-yellow-500 text-gray-900 text-xs py-2 px-3 rounded flex items-center gap-1 font-medium transition shadow-sm">
            <i class="ph-bold ph-plus"></i> Manual
          </button>
        </div>
      </div>

      <!-- LISTA REORDENÁVEL -->
      <div class="flex-1 overflow-y-auto p-3 space-y-2" id="delivery-list">
        <!-- Renderizado dinamicamente -->
      </div>

      <!-- FOOTER DA SIDEBAR -->
      <div class="p-4 border-t border-gray-200 bg-gray-50 flex justify-between gap-2">
        <button onclick="salvarRota()" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white text-xs py-2.5 rounded font-medium flex items-center justify-center gap-2">
          <i class="ph-bold ph-floppy-disk"></i> Salvar na Conta
        </button>
        <button onclick="window.print()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs px-4 py-2.5 rounded font-medium flex items-center justify-center gap-1">
          <i class="ph-bold ph-printer"></i> Imprimir
        </button>
      </div>
    </aside>

    <!-- MAPA & ÁREA IMPRESSA -->
    <main class="flex-1 relative flex flex-col" id="printable-area">
      <!-- MAPA LEAFLET -->
      <div id="map" class="w-full h-full z-0"></div>

      <!-- PAINEL DE INFORMAÇÕES DE VIAGEM -->
      <div class="absolute bottom-4 right-4 bg-white/90 backdrop-blur-md p-4 rounded-xl shadow-xl z-[1000] border border-gray-200 flex items-center gap-6 no-print">
        <div class="flex items-center gap-3">
          <div class="p-3 bg-teal-100 text-brand-darkTeal rounded-lg">
            <i class="ph-bold ph-path text-xl"></i>
          </div>
          <div>
            <p class="text-xs text-gray-500 font-medium">Distância Estimada</p>
            <p id="info-distancia" class="text-lg font-bold text-gray-800">0.0 km</p>
          </div>
        </div>
        <div class="h-8 w-px bg-gray-300"></div>
        <div class="flex items-center gap-3">
          <div class="p-3 bg-yellow-100 text-yellow-700 rounded-lg">
            <i class="ph-bold ph-clock text-xl"></i>
          </div>
          <div>
            <p class="text-xs text-gray-500 font-medium">Tempo de Trajeto</p>
            <p id="info-tempo" class="text-lg font-bold text-gray-800">0 min</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL: DETALHES COMPLETOS DO PEDIDO -->
  <div id="modal-details" class="fixed inset-0 bg-black/50 z-[2000] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="ph-bold ph-package text-brand-teal"></i> Detalhes da Entrega
        </h3>
        <button onclick="fecharModalDetalhes()" class="text-gray-400 hover:text-gray-600">
          <i class="ph-bold ph-x text-xl"></i>
        </button>
      </div>
      <div id="modal-content" class="space-y-2 text-sm text-gray-600">
        <!-- Preenchido via JS -->
      </div>
      <div class="pt-2 text-right">
        <button onclick="fecharModalDetalhes()" class="bg-brand-teal text-white px-4 py-2 rounded text-xs font-bold">Fechar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT DA APLICAÇÃO -->
  <script>
    // Estado inicial com pontos fictícios na região do Rio de Janeiro
    let entregas = [
      { id: 1, cliente: "Distribuidora Central", endereco: "Centro, Rio de Janeiro - RJ", lat: -22.9068, lng: -43.1729, pedido: "PED-1001", nf: "NF-8821", obs: "Portão lateral" },
      { id: 2, cliente: "Mercado do Bairro", endereco: "Botafogo, Rio de Janeiro - RJ", lat: -22.9519, lng: -43.1857, pedido: "PED-1002", nf: "NF-8822", obs: "Receber das 08h às 12h" },
      { id: 3, cliente: "Supermercado Praça", endereco: "Copacabana, Rio de Janeiro - RJ", lat: -22.9694, lng: -43.1868, pedido: "PED-1003", nf: "NF-8823", obs: "Procurar Sr. Marcos" },
      { id: 4, cliente: "Empório Ipanema", endereco: "Ipanema, Rio de Janeiro - RJ", lat: -22.9836, lng: -43.2045, pedido: "PED-1004", nf: "NF-8824", obs: "Entregar docas do fundo" }
    ];

    let map, markersGroup, polylineLayer;

    // Inicialização do Mapa
    function initMap() {
      map = L.map('map').setView([-22.9300, -43.1800], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
      polylineLayer = L.layerGroup().addTo(map);

      renderizarApp();
    }

    // Renderiza a lista lateral, marcadores no mapa e atualiza o traçado viário
    function renderizarApp() {
      renderLista();
      renderMarcadores();
      tracarRotaVariavel();
    }

    function renderLista() {
      const container = document.getElementById('delivery-list');
      container.innerHTML = '';
      document.getElementById('total-count').innerText = `${entregas.length} paradas`;

      entregas.forEach((item, index) => {
        const isFirst = index === 0;
        const isLast = index === entregas.length - 1;

        let tagClass = 'bg-gray-100 text-gray-700';
        let tagText = `Parada #${index + 1}`;
        if (isFirst) { tagClass = 'bg-green-100 text-green-800 font-bold'; tagText = 'INÍCIO'; }
        else if (isLast) { tagClass = 'bg-red-100 text-red-800 font-bold'; tagText = 'FIM'; }

        const card = document.createElement('div');
        card.className = "p-3 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition cursor-grab flex items-center justify-between gap-2";
        card.dataset.id = item.id;

        card.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <i class="ph-bold ph-dots-six-vertical text-gray-400 text-lg"></i>
            <div class="truncate">
              <div class="flex items-center gap-2">
                <span class="text-[10px] px-2 py-0.5 rounded ${tagClass}">${tagText}</span>
                <h4 class="font-bold text-xs text-gray-800 truncate">${item.cliente}</h4>
              </div>
              <p class="text-[11px] text-gray-500 truncate mt-0.5">${item.endereco}</p>
            </div>
          </div>
          <button onclick="exibirDetalhes(${item.id})" class="text-brand-teal hover:bg-teal-50 p-1.5 rounded-full transition" title="Ver Informações Completas">
            <i class="ph-bold ph-info text-base"></i>
          </button>
        `;
        container.appendChild(card);
      });

      // Ativa Arrastar e Soltar na Lista
      new Sortable(container, {
        animation: 150,
        onEnd: function () {
          const newOrder = Array.from(container.children).map(child => parseInt(child.dataset.id));
          entregas = newOrder.map(id => entregas.find(item => item.id === id));
          renderizarApp();
        }
      });
    }

    function renderMarcadores() {
      markersGroup.clearLayers();

      entregas.forEach((item, index) => {
        const isFirst = index === 0;
        const isLast = index === entregas.length - 1;

        let badgeColor = '#0d9488';
        if (isFirst) badgeColor = '#16a34a';
        if (isLast) badgeColor = '#dc2626';

        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background-color: ${badgeColor}; color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-size: 12px;">${index + 1}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(markersGroup);

        // Popup com informações completas ao clicar no ponto do mapa
        marker.bindPopup(`
          <div class="p-1 font-sans">
            <h3 class="font-bold text-sm text-gray-800">${index + 1}. ${item.cliente}</h3>
            <p class="text-xs text-gray-600 mb-2">${item.endereco}</p>
            <div class="text-[11px] border-t pt-1 space-y-0.5 text-gray-500">
              <p><strong>Pedido:</strong> ${item.pedido}</p>
              <p><strong>Nota Fiscal:</strong> ${item.nf}</p>
              <p><strong>Obs:</strong> ${item.obs}</p>
            </div>
            <button onclick="exibirDetalhes(${item.id})" class="mt-2 w-full bg-brand-teal text-white text-[10px] py-1 rounded font-bold">Ver Tudo</button>
          </div>
        `);
      });
    }

    // Traça o caminho exato pelas ruas usando OSRM (Open Source Routing Machine)
    async function tracarRotaVariavel() {
      polylineLayer.clearLayers();
      if (entregas.length < 2) return;

      // Monta as coordenadas no formato 'lng,lat;lng,lat' exigido pela API OSRM
      const coordinates = entregas.map(p => `${p.lng},${p.lat}`).join(';');
      const url = `https://router.project-osrm.org/route/v1/driving/${coordinates}?overview=full&geometries=geojson`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          const route = data.routes[0];
          const routeCoordinates = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);

          // Desenha a linha sólida acompanhando as ruas exatas no mapa
          const polyline = L.polyline(routeCoordinates, {
            color: '#0d9488',
            weight: 5,
            opacity: 0.8
          }).addTo(polylineLayer);

          map.fitBounds(polyline.getBounds(), { padding: [40, 40] });

          // Atualiza tempo e distância calculados
          const distKm = (route.distance / 1000).toFixed(1);
          const durMin = Math.round(route.duration / 60);

          document.getElementById('info-distancia').innerText = `${distKm} km`;
          document.getElementById('info-tempo').innerText = `${durMin} min`;
        }
      } catch (error) {
        // Fallback para linha direta caso haja falha na requisição de rede
        const fallbackCoords = entregas.map(p => [p.lat, p.lng]);
        L.polyline(fallbackCoords, { color: '#0d9488', weight: 4, dashArray: '6, 8' }).addTo(polylineLayer);
      }
    }

    // Algoritmo simples de simulação de otimização Mantendo Início e Fim fixos
    function otimizarRota() {
      if (entregas.length <= 3) return;

      const inicio = entregas[0];
      const fim = entregas[entregas.length - 1];
      let meio = entregas.slice(1, -1);

      // Reordena o meio de acordo com a proximidade geográfica simples
      meio.sort((a, b) => {
        const distA = Math.hypot(a.lat - inicio.lat, a.lng - inicio.lng);
        const distB = Math.hypot(b.lat - inicio.lat, b.lng - inicio.lng);
        return distA - distB;
      });

      entregas = [inicio, ...meio, fim];
      renderizarApp();
    }

    // Modal de Detalhes do Ponto
    function exibirDetalhes(id) {
      const item = entregas.find(e => e.id === id);
      if (!item) return;

      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <p><strong>Cliente / Local:</strong> ${item.cliente}</p>
        <p><strong>Endereço:</strong> ${item.endereco}</p>
        <p><strong>Número do Pedido:</strong> ${item.pedido}</p>
        <p><strong>Número da NF:</strong> ${item.nf}</p>
        <p><strong>Observações:</strong> ${item.obs}</p>
        <p><strong>Coordenadas:</strong> ${item.lat}, ${item.lng}</p>
      `;
      document.getElementById('modal-details').classList.remove('hidden');
    }

    function fecharModalDetalhes() {
      document.getElementById('modal-details').classList.add('hidden');
    }

    // Adição Manual de Endereços
    function adicionarNovoEnderecoModal() {
      const cliente = prompt("Nome do Cliente/Local:");
      if (!cliente) return;
      const endereco = prompt("Endereço Completo:");
      if (!endereco) return;

      // Gera pequenas variações geográficas para fins de teste no mapa
      const last = entregas[entregas.length - 1];
      const newLat = last ? last.lat + (Math.random() - 0.5) * 0.02 : -22.9000;
      const newLng = last ? last.lng + (Math.random() - 0.5) * 0.02 : -43.1800;

      const novo = {
        id: Date.now(),
        cliente: cliente,
        endereco: endereco,
        lat: parseFloat(newLat.toFixed(4)),
        lng: parseFloat(newLng.toFixed(4)),
        pedido: `PED-${Math.floor(1000 + Math.random() * 9000)}`,
        nf: `NF-${Math.floor(1000 + Math.random() * 9000)}`,
        obs: "Adicionado Manualmente"
      };

      entregas.push(novo);
      renderizarApp();
    }

    function salvarRota() {
      alert("Rota salva com sucesso no seu perfil de usuário!");
    }

    function toggleLogin() {
      alert("Saindo do sistema...");
    }

    window.onload = initMap;
  </script>
</body>
</html>
