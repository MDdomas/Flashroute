<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashroute - Organizador de Entregas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            teal: '#00A3A8',
                            tealDark: '#008489',
                            tealLight: '#E5F6F6',
                            yellow: '#F6B21A',
                            yellowDark: '#d99a12'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sortable-ghost { opacity: 0.4; background-color: #E5F6F6; border: 2px dashed #00A3A8; }
        
        @media print {
            body { background: white; }
            #sidebar, #top-nav, #actions-bar, .no-print { display: none !important; }
            #main-content { margin: 0; padding: 0; width: 100%; }
            #planner-view { display: block !important; }
            .print-header { display: block !important; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
            .stop-item { page-break-inside: avoid; border: 1px solid #000; margin-bottom: 8px; border-radius: 8px; padding: 10px; }
            .drag-handle { display: none !important; }
        }
        .print-header { display: none; }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-hidden h-screen w-screen flex flex-col">

    <!-- ========================================== -->
    <!-- TELA DE AUTENTICAÇÃO (LOGIN / CADASTRO) -->
    <!-- ========================================== -->
    <div id="auth-view" class="flex h-screen w-full items-center justify-center bg-gray-50 z-50 absolute inset-0">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
            <div class="flex items-center justify-center gap-2 mb-8">
                <i class="ph-fill ph-path text-4xl text-brand-teal"></i>
                <span class="text-3xl font-bold text-gray-800">Flashroute</span>
            </div>

            <!-- Abas de Navegação -->
            <div class="flex border-b border-gray-200 mb-6">
                <button onclick="switchAuthTab('login')" id="tab-login" class="w-1/2 py-3 font-semibold text-brand-teal border-b-2 border-brand-teal transition-all">Login</button>
                <button onclick="switchAuthTab('register')" id="tab-register" class="w-1/2 py-3 font-semibold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition-all">Cadastro</button>
            </div>

            <!-- Formulário de Login -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 block">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-teal outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-teal outline-none">
                </div>
                <button type="submit" class="w-full bg-brand-teal hover:bg-brand-tealDark text-white font-bold py-3 rounded-lg mt-4 transition-all shadow-md">Entrar</button>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" id="reg-name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-teal outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="reg-email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-teal outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="reg-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-teal outline-none">
                </div>
                <button type="submit" class="w-full bg-brand-yellow hover:bg-brand-yellowDark text-gray-900 font-bold py-3 rounded-lg mt-4 transition-all shadow-md">Criar Conta</button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- APLICATIVO PRINCIPAL -->
    <!-- ========================================== -->
    <div id="app-layout" class="hidden h-screen w-full bg-gray-50 flex">
        
        <!-- Sidebar -->
        <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex flex-col transition-all duration-300 relative z-20 shadow-sm">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-path text-2xl text-brand-teal"></i>
                    <span class="text-xl font-bold text-gray-800">Flashroute</span>
                </div>
            </div>
            
            <div class="p-4 border-b border-gray-100 space-y-2">
                <button onclick="showView('import-view')" class="w-full bg-brand-yellow hover:bg-brand-yellowDark text-gray-900 font-semibold py-2.5 px-4 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2">
                    <i class="ph-bold ph-plus"></i> Nova Rota
                </button>
            </div>

            <div class="flex-1 overflow-y-auto py-4">
                <div class="px-4 mb-2 text-xs font-bold text-gray-400 uppercase tracking-wider">Minhas Rotas Salvas</div>
                <ul id="saved-routes-list" class="space-y-2 px-3">
                    <!-- Rotas preenchidas via JS -->
                </ul>
            </div>
            
            <div class="p-4 border-t border-gray-200 bg-gray-50 text-sm flex items-center justify-between">
                <span id="user-display-name" class="font-medium text-gray-700 truncate mr-2">Usuário</span>
                <button onclick="handleLogout()" class="text-red-500 hover:text-red-700" title="Sair">
                    <i class="ph-bold ph-sign-out text-lg"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 flex flex-col h-screen overflow-hidden relative">
            
            <!-- Top Nav -->
            <header id="top-nav" class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 shrink-0 shadow-sm z-10">
                <h2 id="current-view-title" class="text-lg font-semibold text-gray-800">Painel</h2>
            </header>

            <!-- VIEW: Importar Excel -->
            <div id="import-view" class="flex-1 flex flex-col p-8 bg-gray-50 overflow-y-auto block">
                <div class="max-w-3xl w-full mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-6 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                        <div>
                            <h3 class="text-xl font-bold text-gray-800">Importar Planilha</h3>
                            <p class="text-sm text-gray-500 mt-1">O sistema identificará colunas como Endereço, Bairro e Cidade automaticamente.</p>
                        </div>
                    </div>
                    <div class="p-8" id="upload-step">
                        <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleFileUpload(event)">
                        <div class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:bg-gray-50 hover:border-brand-teal transition-all cursor-pointer group" onclick="document.getElementById('excel-file-input').click()">
                            <div class="w-16 h-16 bg-brand-tealLight text-brand-teal rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="ph-bold ph-upload-simple text-3xl"></i>
                            </div>
                            <h4 class="text-lg font-semibold text-gray-700 mb-1">Clique para selecionar a planilha</h4>
                            <p class="text-sm text-gray-500">.xlsx, .xls, .csv</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIEW: Planejador de Rotas -->
            <div id="planner-view" class="hidden flex-1 flex flex-col h-full overflow-hidden bg-gray-100">
                
                <div class="print-header w-full p-4">
                    <h1 class="text-2xl font-bold text-gray-900">Relatório de Entregas</h1>
                    <p class="text-gray-600" id="print-route-name">Flashroute</p>
                </div>

                <div class="w-full max-w-4xl mx-auto bg-white border-x border-gray-200 flex flex-col h-full shadow-sm">
                    
                    <div class="p-5 border-b border-gray-200 bg-white shrink-0" id="actions-bar">
                        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-4">
                            <input type="text" id="route-name-input" value="Nova Rota" class="font-bold text-xl text-gray-800 bg-transparent border-b border-transparent hover:border-gray-300 focus:border-brand-teal outline-none w-full md:w-1/2 px-1 py-1 transition-all">
                            
                            <button onclick="openGoogleMapsLink()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2.5 px-5 rounded-lg shadow-md flex items-center gap-2">
                                <i class="ph-bold ph-map-trifold"></i> Ver no Google Maps
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                            <button onclick="optimizeRouteByNearest()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-semibold py-2 px-3 rounded-lg flex items-center justify-center gap-1" title="Trava Início/Fim e ordena o meio.">
                                <i class="ph-bold ph-arrows-merge"></i> Otimizar Distância
                            </button>
                            <button onclick="saveCurrentRoute()" class="bg-brand-teal hover:bg-brand-tealDark text-white text-xs font-semibold py-2 px-3 rounded-lg flex items-center justify-center gap-1">
                                <i class="ph-bold ph-floppy-disk"></i> Salvar Rota
                            </button>
                            <button onclick="openManualAddressModal()" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-medium py-1.5 px-2 rounded-lg flex items-center justify-center gap-1">
                                <i class="ph-bold ph-plus"></i> Add Manual
                            </button>
                            <button onclick="window.print()" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-medium py-1.5 px-3 rounded-lg flex items-center justify-center gap-1 no-print">
                                <i class="ph-bold ph-file-pdf"></i> Imprimir / PDF
                            </button>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto p-4 bg-gray-50">
                        <ul id="stops-list" class="space-y-3 pb-20">
                            <!-- JS preenche aqui -->
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: ADD ENDEREÇO -->
    <div id="manual-address-modal" class="fixed inset-0 z-[1000] bg-gray-900/60 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="closeManualAddressModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="ph-bold ph-x text-xl"></i></button>
            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Adicionar Endereço Manualmente</h3>
            <form id="manual-address-form" onsubmit="handleManualAddressSubmit(event)" class="space-y-3">
                <input type="text" id="manual-client" class="w-full px-3 py-2 border rounded-lg outline-none" placeholder="Nome do Cliente / Identificação" required>
                <input type="text" id="manual-street" class="w-full px-3 py-2 border rounded-lg outline-none" placeholder="Endereço (Rua, Número)" required>
                <input type="text" id="manual-city" class="w-full px-3 py-2 border rounded-lg outline-none" placeholder="Bairro / Cidade" required>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeManualAddressModal()" class="w-1/2 bg-gray-100 py-2 rounded-lg">Cancelar</button>
                    <button type="submit" class="w-1/2 bg-brand-teal text-white py-2 rounded-lg">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script>
        // ==========================================
        // SISTEMA DE AUTENTICAÇÃO E DADOS
        // ==========================================
        let usersDB = JSON.parse(localStorage.getItem('flashroute_users_v2')) || {};
        let currentUserEmail = localStorage.getItem('flashroute_logged_in') || null;
        
        let currentStops = [];
        let sortableInstance = null;

        // Ao carregar a página
        document.addEventListener("DOMContentLoaded", () => {
            if (currentUserEmail && usersDB[currentUserEmail]) {
                showAppLayout();
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
                document.getElementById('app-layout').classList.add('hidden');
            }
            initSortable();
        });

        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('tab-login').classList.replace('text-gray-400', 'text-brand-teal');Compreendo perfeitamente a sua preocupação e o que você precisa. Peço desculpas se a versão anterior modificou mais do que devia. Vamos manter a base original do seu projeto no arquivo Flashroute intacta e focar **apenas** no que foi solicitado.
